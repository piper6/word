<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>単語フラッシュカード</title>
<style>
  :root{
    --bg:#0f1115; --panel:#1a1e27; --panel2:#232838; --text:#e8ecf3;
    --muted:#8b93a7; --accent:#5b8cff; --accent2:#3ecf8e; --warn:#ffb454;
    --border:#2c3242; --shadow:0 12px 40px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%,#1b2030,#0f1115 60%);
    color:var(--text);display:flex;flex-direction:column;min-height:100vh;
  }
  header{
    padding:18px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    border-bottom:1px solid var(--border);
  }
  h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.5px}
  .stats{color:var(--muted);font-size:13px;margin-left:auto}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button,.filebtn,select{
    background:var(--panel2);color:var(--text);border:1px solid var(--border);
    padding:8px 14px;border-radius:10px;font-size:13px;cursor:pointer;
    transition:.15s;font-family:inherit;
  }
  button:hover,.filebtn:hover{border-color:var(--accent);background:#2a3145}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.1)}
  button:disabled,select:disabled{opacity:.4;cursor:not-allowed}
  .seg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .seg button{border:none;border-radius:0;background:var(--panel)}
  .seg button.on{background:var(--accent);color:#fff}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
  /* drop zone */
  #drop{
    width:min(560px,90vw);border:2px dashed var(--border);border-radius:18px;
    padding:48px 28px;text-align:center;color:var(--muted);background:var(--panel);
    transition:.15s;
  }
  #drop.hot{border-color:var(--accent);background:#1c2536;color:var(--text)}
  #drop h2{color:var(--text);margin:0 0 8px;font-size:20px}
  #drop p{margin:6px 0;font-size:14px;line-height:1.7}
  #drop code{background:var(--panel2);padding:2px 7px;border-radius:6px;color:var(--accent2)}
  /* card */
  .card-wrap{width:min(620px,92vw);display:none;flex-direction:column;align-items:center;gap:20px}
  .card{
    width:100%;min-height:300px;border-radius:22px;background:var(--panel);
    border:1px solid var(--border);box-shadow:var(--shadow);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:40px 32px;cursor:pointer;position:relative;user-select:none;text-align:center;
    transition:transform .12s;
  }
  .card:active{transform:scale(.99)}
  .side-label{
    position:absolute;top:16px;left:20px;font-size:11px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--muted);font-weight:700;
  }
  .badge{
    position:absolute;top:14px;right:16px;font-size:11px;padding:4px 10px;border-radius:999px;
    background:rgba(255,180,84,.15);color:var(--warn);border:1px solid rgba(255,180,84,.35);
    font-weight:700;letter-spacing:.5px;
  }
  .term{font-size:clamp(24px,5vw,40px);font-weight:700;line-height:1.35;word-break:break-word}
  .answer{font-size:clamp(20px,4vw,32px);color:var(--accent2);font-weight:600;line-height:1.4;margin-top:6px}
  .answer.none{color:var(--warn);font-size:20px;font-style:italic}
  .hint{position:absolute;bottom:16px;font-size:12px;color:var(--muted)}
  .divider{width:60%;height:1px;background:var(--border);margin:22px 0 14px}
  .nav{display:flex;gap:12px;align-items:center}
  .counter{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:90px;text-align:center}
  .kbd{font-size:12px;color:var(--muted);text-align:center;margin-top:2px}
  .kbd b{color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-weight:600}
  .empty-msg{color:var(--muted);text-align:center}
</style>
</head>
<body>
<header>
  <h1>単語フラッシュカード</h1>
  <div class="toolbar">
    <label class="filebtn">ファイルを選択
      <input id="fileInput" type="file" accept=".md,.txt" style="display:none">
    </label>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)">
      グループ
      <select id="groupSelect" disabled title="ファイルの順に100枚ずつ">
        <option value="0">ファイルを読み込んでください</option>
      </select>
    </label>
    <div class="seg" id="dirSeg" title="出題の向き">
      <button data-dir="term" class="on">表→裏</button>
      <button data-dir="answer">裏→表</button>
      <button data-dir="mix">ミックス</button>
    </div>
    <button id="shuffleBtn" title="選択中のグループ内で並べ替え">シャッフル</button>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)">
      <input id="skipEmpty" type="checkbox"> 答えなしを除く
    </label>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)">
      <input id="autoSpeak" type="checkbox" checked> 英語を自動再生
    </label>
    <button id="speakBtn" disabled>英語を再生</button>
    <span id="audioStatus" role="status" style="font-size:12px;color:var(--muted)"></span>
  </div>
  <div class="stats" id="stats"></div>
</header>

<main>
  <div id="drop">
    <h2>word.md をここにドロップ</h2>
    <p>または右上の「ファイルを選択」から読み込みます。</p>
    <p>各行は <code>表\答え</code> の形式で解釈します。<br>
       <code>\</code> がない行はそのまま表、答えは空になります。</p>
  </div>

  <div class="card-wrap" id="cardWrap">
    <div class="card" id="card">
      <span class="side-label" id="sideLabel">FRONT</span>
      <span class="badge" id="badge" style="display:none">答えなし</span>
      <div class="term" id="frontText"></div>
      <div id="revealArea" style="display:none;width:100%">
        <div class="divider"></div>
        <div class="answer" id="answerText"></div>
      </div>
      <div class="hint" id="hint">クリック / スペースキーでめくる</div>
    </div>
    <div class="nav">
      <button id="prevBtn">← 前</button>
      <span class="counter" id="counter">0 / 0</span>
      <button id="nextBtn" class="primary">次 →</button>
    </div>
    <div class="kbd"><b>Space</b> めくる &nbsp;·&nbsp; <b>→</b> 次 &nbsp;·&nbsp; <b>←</b> 前 &nbsp;·&nbsp; <b>S</b> シャッフル</div>
  </div>
</main>

<script>
(function(){
  "use strict";
  var LS_KEY = "flashcards_deck_v1";
  var cards = [];        // {term, answer, hasAnswer}
  var order = [];        // indices into cards
  var pos = 0;
  var revealed = false;
  var direction = "term"; // term | answer | mix
  var skipEmpty = false;
  var GROUP_SIZE = 100;
  var group = 0;

  var el = function(id){return document.getElementById(id);};
  var drop = el("drop"), cardWrap = el("cardWrap");
  var groupSelect = el("groupSelect");
  var frontText = el("frontText"), answerText = el("answerText");
  var revealArea = el("revealArea"), sideLabel = el("sideLabel");
  var badge = el("badge"), counter = el("counter"), stats = el("stats"), hint = el("hint");

  // Recognize English on either side without sending Japanese text to the voice.
  function isEnglish(text){
    return /[a-z]/i.test(text) &&
      !/[\u3040-\u30ff\u3400-\u9fff\uf900-\ufaff\uff66-\uff9f]/.test(text);
  }
  var synth = window.speechSynthesis;
  var audioSupported = !!(synth && window.SpeechSynthesisUtterance);
  var audioReady = false, visibleEnglish = "", speechVersion = 0;
  var autoSpeak = el("autoSpeak"), speakBtn = el("speakBtn"), audioStatus = el("audioStatus");
  try{ autoSpeak.checked = localStorage.getItem("flashcards_auto_speak") !== "false"; }catch(e){}
  if(!audioSupported){
    autoSpeak.disabled = true;
    audioStatus.textContent = "このブラウザは音声再生に対応していません";
  }
  function stopSpeech(){
    speechVersion++;
    if(audioSupported) synth.cancel();
  }
  function speakEnglish(){
    if(!audioSupported || !visibleEnglish) return;
    stopSpeech();
    var version = speechVersion;
    var utterance = new SpeechSynthesisUtterance(visibleEnglish);
    var voices = synth.getVoices();
    var voice = voices.find(function(v){ return /^en[-_]US$/i.test(v.lang); }) ||
      voices.find(function(v){ return /^en(?:[-_]|$)/i.test(v.lang); });
    utterance.lang = voice ? voice.lang : "en-US";
    if(voice) utterance.voice = voice;
    utterance.onerror = function(e){
      if(version !== speechVersion || e.error === "canceled" || e.error === "interrupted") return;
      audioStatus.textContent = "音声を再生できません。「英語を再生」を押してください";
    };
    audioStatus.textContent = "";
    synth.speak(utterance);
  }
  function updateAudio(text, newPresentation){
    var changed = text !== visibleEnglish;
    if(changed || newPresentation) stopSpeech();
    visibleEnglish = text;
    speakBtn.disabled = !audioSupported || !text;
    if(audioSupported){
      audioStatus.textContent = text && autoSpeak.checked && !audioReady ? "クリックまたはキー操作で音声を開始" : "";
    }
    if(text && autoSpeak.checked && audioReady && (changed || newPresentation)) speakEnglish();
  }
  function enableAudio(e){
    if(!e.isTrusted || audioReady) return;
    audioReady = true;
    if(autoSpeak.checked) speakEnglish();
  }
  document.addEventListener("click", enableAudio, true);
  document.addEventListener("keydown", enableAudio, true);
  speakBtn.addEventListener("click", speakEnglish);
  autoSpeak.addEventListener("change", function(){
    try{ localStorage.setItem("flashcards_auto_speak", String(autoSpeak.checked)); }catch(e){}
    stopSpeech();
    if(audioSupported) audioStatus.textContent = "";
    if(autoSpeak.checked) speakEnglish();
  });
  window.addEventListener("pagehide", stopSpeech);

  // ---- parsing ----
  function parse(text){
    var out = [];
    var lines = text.split(/\r?\n/);
    for(var i=0;i<lines.length;i++){
      var line = lines[i].replace(/\s+$/,"");
      var core = line.trim();
      if(core === "" || core === "#") continue;
      var idx = line.indexOf("\\");
      var term, answer;
      if(idx === -1){ term = line.trim(); answer = ""; }
      else { term = line.slice(0,idx).trim(); answer = line.slice(idx+1).trim(); }
      if(term === "" && answer === "") continue;
      out.push({term:term, answer:answer, hasAnswer: answer.length>0});
    }
    return out;
  }

  function loadDeck(text){
    var parsed = parse(text);
    if(parsed.length === 0){
      alert("有効な単語が見つかりませんでした。");
      return;
    }
    cards = parsed;
    group = 0;
    buildGroups();
    try{ localStorage.setItem(LS_KEY, text); }catch(e){}
    shuffle();
    drop.style.display = "none";
    cardWrap.style.display = "flex";
    render();
  }

  // ---- deck ops ----
  function buildGroups(){
    groupSelect.textContent = "";
    for(var start=0;start<cards.length;start+=GROUP_SIZE){
      var option = document.createElement("option");
      option.value = String(start / GROUP_SIZE);
      option.textContent = "グループ " + (start / GROUP_SIZE + 1) +
        "（" + (start + 1) + "–" + Math.min(start + GROUP_SIZE, cards.length) + "）";
      groupSelect.appendChild(option);
    }
    groupSelect.value = String(group);
    groupSelect.disabled = false;
  }

  function activeIndices(){
    var arr = [];
    var start = group * GROUP_SIZE;
    var end = Math.min(start + GROUP_SIZE, cards.length);
    for(var i=start;i<end;i++){
      if(skipEmpty && !cards[i].hasAnswer) continue;
      arr.push(i);
    }
    return arr;
  }
  function shuffle(){
    order = activeIndices();
    for(var i=order.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=order[i]; order[i]=order[j]; order[j]=t;
    }
    pos = 0; revealed = false;
  }

  // decide which side is shown first for this card
  function frontIsTerm(cardIndex){
    if(direction === "term") return true;
    if(direction === "answer") return false;
    // mix: stable pseudo-random per card
    return (cardIndex % 2) === 0;
  }

  function render(newPresentation){
    newPresentation = newPresentation !== false;
    stats.textContent = cards.length ? "全 " + cards.length + " 枚 · グループ " +
      (group + 1) + " / " + Math.ceil(cards.length / GROUP_SIZE) +
      " · 対象 " + order.length + " 枚" : "";
    el("prevBtn").disabled = el("nextBtn").disabled = order.length === 0;
    if(order.length === 0){
      updateAudio("", true);
      frontText.textContent = "";
      counter.textContent = "0 / 0";
      revealArea.style.display = "none";
      badge.style.display = "none";
      sideLabel.textContent = "";
      frontText.innerHTML = '<span class="empty-msg">このグループには表示できるカードがありません。<br>別のグループを選ぶか「答えなしを除く」を外してください。</span>';
      hint.textContent = "";
      return;
    }
    var ci = order[pos];
    var c = cards[ci];
    var showTerm = frontIsTerm(ci);
    var front = showTerm ? c.term : c.answer;
    var back  = showTerm ? c.answer : c.term;
    var backExists = showTerm ? c.hasAnswer : (c.term.length>0);

    // if chosen front is empty (e.g. answer side of an empty-answer card), fall back to term
    if(front === ""){ front = c.term; back = c.answer; backExists = c.hasAnswer; showTerm = true; }

    var englishAnswer = revealed && backExists && isEnglish(back);
    var english = englishAnswer ? back : (isEnglish(front) ? front : "");
    updateAudio(english, newPresentation || englishAnswer);

    sideLabel.textContent = showTerm ? "英語 / 表" : "訳 / 裏";
    frontText.textContent = front;

    // "no answer" badge shown on the front when there is nothing to reveal
    if(!backExists){
      badge.style.display = "";
    } else {
      badge.style.display = "none";
    }

    if(revealed){
      revealArea.style.display = "";
      if(backExists){
        answerText.textContent = back;
        answerText.className = "answer";
      } else {
        answerText.textContent = "（答えなし）";
        answerText.className = "answer none";
      }
      hint.textContent = "クリック / → で次へ";
    } else {
      revealArea.style.display = "none";
      hint.textContent = backExists ? "クリック / スペースキーでめくる" : "答えなし — クリックで確認";
    }

    counter.textContent = (pos+1) + " / " + order.length;
  }

  function flip(){ revealed = !revealed; render(false); }
  function next(){ if(order.length===0)return; pos=(pos+1)%order.length; revealed=false; render(); }
  function prev(){ if(order.length===0)return; pos=(pos-1+order.length)%order.length; revealed=false; render(); }

  // ---- events ----
  el("card").addEventListener("click", flip);
  el("nextBtn").addEventListener("click", next);
  el("prevBtn").addEventListener("click", prev);
  el("shuffleBtn").addEventListener("click", function(){ shuffle(); render(); });
  groupSelect.addEventListener("change", function(){
    var selected = Number(groupSelect.value);
    if(!Number.isInteger(selected) || selected < 0 || selected >= Math.ceil(cards.length / GROUP_SIZE)) return;
    group = selected;
    shuffle();
    render();
  });

  el("skipEmpty").addEventListener("change", function(e){
    skipEmpty = e.target.checked; shuffle(); render();
  });

  var dirSeg = el("dirSeg");
  dirSeg.addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    direction = b.getAttribute("data-dir");
    Array.prototype.forEach.call(dirSeg.children,function(x){x.classList.remove("on");});
    b.classList.add("on");
    revealed = false; render();
  });

  document.addEventListener("keydown", function(e){
    if(e.target.closest("button, input, select, textarea, label") || e.target.isContentEditable) return;
    if(cardWrap.style.display !== "flex") return;
    if(e.code === "Space"){ e.preventDefault(); flip(); }
    else if(e.code === "ArrowRight"){ next(); }
    else if(e.code === "ArrowLeft"){ prev(); }
    else if(e.key === "s" || e.key === "S"){ shuffle(); render(); }
  });

  // file input
  el("fileInput").addEventListener("change", function(e){
    var f = e.target.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){ loadDeck(r.result); };
    r.readAsText(f, "utf-8");
  });

  // drag & drop
  ["dragenter","dragover"].forEach(function(ev){
    drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add("hot");});
    document.addEventListener(ev,function(e){e.preventDefault();});
  });
  ["dragleave","drop"].forEach(function(ev){
    drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove("hot");});
  });
  drop.addEventListener("drop", function(e){
    e.preventDefault(); drop.classList.remove("hot");
    var f = e.dataTransfer.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){ loadDeck(r.result); };
    r.readAsText(f, "utf-8");
  });
  document.addEventListener("drop", function(e){e.preventDefault();});

  // restore last deck if available
  try{
    var saved = localStorage.getItem(LS_KEY);
    if(saved){ loadDeck(saved); }
  }catch(e){}
})();
</script>
</body>
</html>
